<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>テトリス風ブロック落とし</title>
</head>
<body>
	<div id="app">
		<h1><img src="/src/assets/title-w.png" alt="テトリス風ブロック落とし" class="title-image" /></h1>

		<!-- スタート画面 -->
		<div id="start-screen" class="start-screen">
			<label>
				プレイヤー名：
				<input type="text" id="player-name-input" placeholder="なまえを入力" maxlength="10" />
			</label>
			<button id="start-button"><img src="/src/assets/start.png" alt="スタート" class="button-image" /></button>

			<!-- 対戦モード -->
			<div class="versus-section">
				<p>対戦モード</p>
				<button id="create-room-button">部屋を作る</button>
				<div class="join-room-row">
					<input type="text" id="room-code-input" placeholder="部屋番号を入力" maxlength="6" />
					<button id="join-room-button">入室する</button>
				</div>
				<button id="random-match-button">ランダム対戦</button>
			</div>
		</div>

		<!-- 待機画面 -->
		<div id="waiting-screen" class="hidden waiting-screen">
			<p>部屋番号: <span id="waiting-room-code"></span></p>
			<p>対戦相手を待っています...</p>
			<div class="loading-spinner"></div>
		</div>

		<!-- ゲーム画面 -->
		<div id="game-screen" class="hidden">
			<div class="play-score">
				<p>名前：<span id="player-name"></span></p>
				<p>スコア：<span id="score">0</span></p>
				<p>レベル：<span id="level">1</span></p>
			</div>

			<div class="game-area">
				<!-- PC用: キー操作の説明 -->
				<div class="key-guide">
					<p class="key-guide-title">操作方法</p>
					<div class="key-guide-row"><span class="key-badge">← →</span> 移動</div>
					<div class="key-guide-row"><span class="key-badge">↑ / X</span> 右回転</div>
					<div class="key-guide-row"><span class="key-badge">Z</span> 左回転</div>
					<div class="key-guide-row"><span class="key-badge">↓</span> ソフトドロップ</div>
					<div class="key-guide-row"><span class="key-badge">Space</span> ハードドロップ</div>
					<div class="key-guide-row"><span class="key-badge">C</span> ホールド</div>
				</div>
				<div class="canvas-wrapper">
					<canvas id="game-canvas" width="300" height="600"></canvas>
					<div id="game-over-overlay" class="hidden">
						<div class="game-over-box">
							<h2><img src="/src/assets/gameover.png" alt="ゲームオーバー" class="game-over-image" /></h2>
							<p id="versus-result" class="versus-result hidden"></p>
							<p>スコア：<span id="final-score"></span></p>
							<div class="high-scores my-score">
								<p class="high-scores-title">自己ベスト(端末)</p>
								<ol id="high-score-list"></ol>
							</div>
							<div class="high-scores all-high-score">
								<p class="high-scores-title">みんなのハイスコア</p>
								<ol id="global-high-score-list"></ol>
							</div>
							<div class="game-over-button-wrap">
								<button id="restart-button" class="game-over-button"><img src="/src/assets/retry.png" alt="もう一度遊ぶ" class="button-image"></button>
								<button id="return-start-button" class="game-over-button"><img src="/src/assets/return-start.png" alt="スタート画面に戻る" class="button-image"></button>
							</div>
						</div>
					</div>
				</div>

				<!-- 対戦相手の盤面（対戦中のみ表示） -->
				<div class="opponent-wrapper hidden" id="opponent-wrapper">
					<div class="opponent-meta">
						<p class="opponent-label">対戦相手</p>
						<p>スコア: <span id="opponent-score">0</span></p>
					</div>
					<canvas id="opponent-canvas" width="150" height="300"></canvas>
				</div>

				<div class="side-panel">
					<div class="hold-next-box">
						<!-- ホールド -->
						<div class="hold-box">
							<p>Hold</p>
							<canvas id="hold-canvas" width="80" height="80"></canvas>
						</div>
						<!-- 次のブロック -->
						<div class="next-box">
							<p>Next</p>
							<canvas id="next-canvas-1" width="80" height="80"></canvas>
							<canvas id="next-canvas-2" width="80" height="80"></canvas>
						</div>
					</div>
					<!-- スマホ用操作ボタン -->
					<div class="touch-controls">
						<div class="touch-row">
							<button id="btn-rotate-ccw"><img src="./src/assets/rotate.png" alt="右回り" class="button-image" /></button>
							<button id="btn-rotate"><img src="./src/assets/rotate-reverse.png" alt="左回り" class="button-image" /></button>
						</div>
						<div class="touch-row">
							<button id="btn-left">←</button>
							<button id="btn-right">→</button>
						</div>
						<div class="touch-row">
							<button id="btn-down"><img src="./src/assets/soft-down.png" alt="ソフトドロップ" class="button-image" /></button>
							<button id="btn-drop">⏬</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
